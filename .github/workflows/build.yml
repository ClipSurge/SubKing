name: Build SubKing (Windows VST3)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/SubKing_artefacts/Release/VST3/SubKing.vst3" dist/
          Copy-Item "build/SubKing_artefacts/Release/Standalone/SubKing.exe" dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: SubKing-Windows-VST3
          path: dist
